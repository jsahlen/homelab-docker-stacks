services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    environment:
      PUID: 1005
      PGID: 1005
      DATA_DIR: /docker/ct-mgmt/dockhand/data
      TRUST_FORWARD_HEADERS: true
      COOKIE_SECURE: true
    group_add:
      - "${DOCKER_GID:?find with stat -c '%g' /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/docker/ct-mgmt/dockhand/data
    networks:
      - mgmt

networks:
  mgmt:
    external: true

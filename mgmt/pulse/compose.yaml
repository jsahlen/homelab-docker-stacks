services:
  pulse:
    image: rcourtman/pulse:6
    container_name: pulse
    user: "1005:1005"
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      PULSE_DEPLOYMENT_METHOD: docker_compose
      PULSE_TELEMETRY: false
    networks:
      - mgmt

networks:
  mgmt:
    external: true

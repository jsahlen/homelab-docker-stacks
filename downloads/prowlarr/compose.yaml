services:
  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    depends_on:
      - flaresolverr
    environment:
      TZ: Europe/Stockholm
      PUID: 1005
      PGID: 1005
    networks:
      - default
      - downloads
    volumes:
      - ./data:/config
    ports:
      - 8205:9696

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: prowlarr-flaresolverr
    restart: unless-stopped
    environment:
      TZ: Europe/Stockholm
      PUID: 1005
      PGID: 1005

networks:
  downloads:
    external: true

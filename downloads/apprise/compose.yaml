services:
  apprise:
    image: ghcr.io/linuxserver/apprise-api:latest
    container_name: apprise
    environment:
      TZ: Europe/Stockholm
      PUID: 1005
      PGID: 1005
    networks:
      - downloads
    volumes:
      - apprise_attachments:/apprise/attachments

volumes:
  apprise_attachments:

networks:
  downloads:
    external: true

services:
  homebridge:
    image: homebridge/homebridge:latest
    container_name: homebridge
    network_mode: host
    environment:
      TZ: Europe/Stockholm
      PUID: 1005
      PGID: 1005
      HOMEBRIDGE_CONFIG_UI: 1
      HOMEBRIDGE_CONFIG_UI_PORT: 8080
    volumes:
      - ./data:/homebridge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5

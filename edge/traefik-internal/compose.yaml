services:
  traefik:
    image: traefik:3
    container_name: traefik-internal
    restart: unless-stopped
    user: 1005:1005
    command:
      - --api=true
      - --ping.manualRouting=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=cloudflare
      - --certificatesresolvers.cloudflare.acme.email=${EMAIL:?}
      - --certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_dns_api_token
    secrets:
      - cloudflare_dns_api_token
    networks:
      default: null
      rproxy: null
    ports:
      - "${INTERNAL_LAN_HTTP_PORT:-80}:80"
      - "${INTERNAL_LAN_HTTPS_PORT:-443}:443"
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./data/acme.json:/etc/traefik/acme.json

networks:
  rproxy:
    external: true

secrets:
  cloudflare_dns_api_token:
    file: ./secrets/cloudflare_dns_api_token
